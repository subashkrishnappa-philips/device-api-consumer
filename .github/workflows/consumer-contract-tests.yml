# ──────────────────────────────────────────────────────────────────────────────
# Consumer Contract Tests — device-api-consumer
#
# Owned by: Mobile Device Management Team  (consumer team)
#
# What runs:
#   1. Build DeviceApi.Consumer.sln
#   2. Run consumer tests — generates pact file in contracts/
#   3. Upload pact file as artifact "pact-contracts" (retained 90 days)
#   4. On main push: dispatch "pact-contracts-updated" to device-api (provider)
#      so the provider pipeline immediately re-verifies the new contract.
#
# Additionally — on repository_dispatch: swagger-updated
#   (fired by device-api's swagger-sync.yml when swagger changes):
#   5. Download generated stubs from provider artifact
#   6. Open a PR in this repo with new stub files in Generated/
#      so the consumer team can review → move to Contracts/ → push
# ──────────────────────────────────────────────────────────────────────────────

name: Consumer Contract Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  repository_dispatch:
    types:
      - pact-contracts-updated  # fired by provider CI after API changes
      - swagger-updated          # fired by provider's swagger-sync when new endpoints added
  # Manual trigger — use this when CONSUMER_REPO_TOKEN is not yet configured and
  # the automatic swagger-updated dispatch is skipped.  Find the provider run ID
  # in the swagger-sync job summary or the Actions URL.
  workflow_dispatch:
    inputs:
      provider_repo:
        description: 'Provider repo (owner/repo)'
        required: true
        default: 'subashkrishnappa-philips/device-api'
      provider_run_id:
        description: 'swagger-sync Actions run ID'
        required: true
      provider_sha:
        description: 'Provider commit SHA'
        required: false
        default: 'manual'
      stub_count:
        description: 'Number of stubs generated'
        required: false
        default: '?'
      swagger_url:
        description: 'Link to the swagger-sync run'
        required: false
        default: ''

concurrency:
  # Use event name in group so swagger-updated dispatches don't cancel running push jobs
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true
  CONFIGURATION: Release

# Required for peter-evans/create-pull-request to open PRs and create labels,
# and dorny/test-reporter to create GitHub Check runs.
permissions:
  contents: write
  pull-requests: write
  issues: write    # needed for create-pull-request to create labels that don't yet exist
  checks: write    # needed for dorny/test-reporter

jobs:
  # ── Job 1: Build ─────────────────────────────────────────────────────────────
  # Skipped on swagger-updated dispatch (no tests to run, just PR creation)
  build:
    name: Restore & Build
    runs-on: ubuntu-latest
    if: github.event_name != 'repository_dispatch' || github.event.action != 'swagger-updated'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-consumer-${{ runner.os }}-${{ hashFiles('**/packages.lock.json', '**/*.csproj') }}
          restore-keys: nuget-consumer-${{ runner.os }}-

      - name: Restore
        run: dotnet restore DeviceApi.Consumer.sln

      - name: Build
        run: dotnet build DeviceApi.Consumer.sln --no-restore --configuration ${{ env.CONFIGURATION }}

      - name: Cache build output
        uses: actions/cache@v4
        with:
          path: |
            tests/**/bin
            tests/**/obj
          key: build-consumer-${{ runner.os }}-${{ github.sha }}

  # ── Job 2: Generate Pact Contracts ───────────────────────────────────────────
  generate-pacts:
    name: Generate & Publish Pact Contracts
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'repository_dispatch' || github.event.action != 'swagger-updated'
    env:
      # Expose secret existence as an env var — the secrets context is NOT
      # available in step-level if: expressions, but env vars are.
      HAS_PROVIDER_TOKEN: ${{ secrets.PROVIDER_REPO_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-consumer-${{ runner.os }}-${{ hashFiles('**/packages.lock.json', '**/*.csproj') }}
          restore-keys: nuget-consumer-${{ runner.os }}-

      - name: Restore build output cache
        uses: actions/cache@v4
        with:
          path: |
            tests/**/bin
            tests/**/obj
          key: build-consumer-${{ runner.os }}-${{ github.sha }}

      # contracts/ must exist before tests run so PactNet can write the pact file
      - name: Ensure contracts directory exists
        run: mkdir -p contracts

      - name: Run consumer tests (generates pact contracts)
        run: |
          dotnet test tests/DeviceApi.Consumer.Tests \
            --configuration ${{ env.CONFIGURATION }} \
            --logger "trx;LogFileName=consumer-results.trx" \
            --logger "console;verbosity=normal" \
            --results-directory TestResults/

      - name: List generated pact files
        run: |
          echo "── contracts/ ──────────────────────────────"
          ls -la contracts/

      # ── Publish pact files so provider CI can download them ──────────────────
      - name: Upload pact contracts
        uses: actions/upload-artifact@v4
        with:
          name: pact-contracts
          path: contracts/*.json
          retention-days: 90
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consumer-test-results-${{ github.sha }}
          path: TestResults/

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
            files: "TestResults/*.trx"
            check_name: "Consumer Contract Test Results"

      # ── Dispatch provider verification ──────────────────────────────────────
      # Fires repository_dispatch on device-api so provider CI re-verifies
      # the new pact immediately after consumer merges to main.
      #
      # PROVIDER_REPO_TOKEN requirements (repository_dispatch API):
      #   • Classic PAT  → repo scope
      #   • Fine-grained PAT → Resource owner must include device-api's owner,
      #                        Repository access must include device-api,
      #                        Permission: Contents = Write
      - name: Dispatch provider verification
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && env.HAS_PROVIDER_TOKEN == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROVIDER_REPO_TOKEN }}
          script: |
            const providerRepo = 'device-api';
            const owner        = context.repo.owner;

            try {
              await github.rest.repos.createDispatchEvent({
                owner,
                repo:         providerRepo,
                event_type:   'pact-contracts-updated',
                client_payload: {
                  consumer_repo:   `${owner}/${context.repo.repo}`,
                  consumer_run_id: String(context.runId),
                  consumer_sha:    context.sha,
                  consumer_ref:    context.ref.replace('refs/heads/', '')
                }
              });

              console.log(`✅ repository_dispatch sent to ${owner}/${providerRepo}`);
              await core.summary
                .addHeading('Provider Dispatch', 3)
                .addRaw(`✅ \`pact-contracts-updated\` dispatched to **${owner}/${providerRepo}**.`)
                .write();

            } catch (err) {
              const is403 = err.status === 403;
              const msg = is403
                ? [
                    `repository_dispatch on ${owner}/${providerRepo} returned 403.`,
                    ``,
                    `PROVIDER_REPO_TOKEN does not have the required permissions.`,
                    `Fix one of the following in GitHub → Settings → Developer settings → Personal access tokens:`,
                    ``,
                    `  Classic PAT  : enable the "repo" scope`,
                    `  Fine-grained : set Resource owner = ${owner}`,
                    `                 Repository access  = ${providerRepo} (or "All repositories")`,
                    `                 Permission         : Contents → Write`
                  ].join('\n')
                : `Dispatch failed (HTTP ${err.status}): ${err.message}`;

              await core.summary
                .addHeading('Provider Dispatch — Failed', 3)
                .addRaw(`❌ \`pact-contracts-updated\` could **not** be dispatched to **${owner}/${providerRepo}**.\n\n`)
                .addRaw('```\n' + msg + '\n```')
                .write();

              core.setFailed(msg);
            }

  # ── Job 3: Create Stub PR (swagger-updated dispatch only) ────────────────────
  # Triggered when provider's swagger-sync.yml detects new/changed endpoints.
  #
  # Downloads the generated stub files from the provider CI artifact,
  # places them in tests/DeviceApi.Consumer.Tests/Generated/, and opens
  # a PR so the consumer team can review, complete, and merge the stubs.
  #
  # Consumer team workflow after merge:
  #   1. Review Generated/*.cs — understand what changed
  #   2. Move completed interactions to Contracts/DeviceApiConsumerTests.cs
  #   3. Delete the stub from Generated/
  #   4. Push → consumer CI generates new pact → provider CI re-verifies
  create-stub-pr:
    name: Open Stub PR for New Swagger Endpoints
    runs-on: ubuntu-latest
    # Runs automatically via repository_dispatch (when CONSUMER_REPO_TOKEN is set)
    # OR manually via workflow_dispatch (when the token is absent — see inputs above)
    if: |
      (github.event_name == 'repository_dispatch' && github.event.action == 'swagger-updated') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout consumer repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

# Download the generated stubs uploaded by provider's swagger-sync job
      - name: Download generated stubs from provider CI
        uses: actions/download-artifact@v6
        with:
          # Required for cross-repo or specific run-id downloads
          github-token: ${{ secrets.PROVIDER_REPO_TOKEN || github.token }}
          
          # Target Repository (e.g., "org/device-api")
          repository: ${{ inputs.provider_repo || github.event.client_payload.provider_repo }}
          
          # Specific Run ID from the provider
          run-id: ${{ inputs.provider_run_id || github.event.client_payload.provider_run_id }}
          
          # Artifact name and destination
          name: swagger-generated-stubs
          path: tests/DeviceApi.Consumer.Tests/Generated/
          
        # Handle cases where token isn't set or run isn't found
        continue-on-error: true

      - name: Check stubs were downloaded
        id: check-stubs
        run: |
          COUNT=$(find tests/DeviceApi.Consumer.Tests/Generated/ -name "*.cs" 2>/dev/null | wc -l)
          echo "stub_count=$COUNT" >> $GITHUB_OUTPUT
          if [ "$COUNT" -gt 0 ]; then
            echo "stubs_exist=true" >> $GITHUB_OUTPUT
            echo "Downloaded $COUNT stub file(s) — will open PR."
          else
            echo "stubs_exist=false" >> $GITHUB_OUTPUT
            echo "::warning::No stub files downloaded. PROVIDER_REPO_TOKEN may not be configured, or the cross-repo artifact was unavailable. Skipping PR creation."
          fi

      - name: Download consumer notification report
        uses: actions/download-artifact@v4
        with:
          # Use the provided token or fall back to default
          github-token: ${{ secrets.PROVIDER_REPO_TOKEN || github.token }}
          
          # Cross-repo source (e.g., "org/device-api")
          repository: ${{ inputs.provider_repo || github.event.client_payload.provider_repo }}
          
          # The specific run to pull from
          run-id: ${{ inputs.provider_run_id || github.event.client_payload.provider_run_id }}
          
          name: consumer-notification
          path: /tmp/
          
        # Keeps the workflow alive if the artifact isn't found or permissions fail
        continue-on-error: true

      - name: List downloaded stubs
        run: |
          echo "── Generated stubs ─────────────────────────────"  
          find tests/DeviceApi.Consumer.Tests/Generated/ -name "*.cs" || echo "(none)"

      - name: Read notification report
        id: notification
        run: |
          if [ -f /tmp/consumer-notification.md ]; then
            # Truncate to 3000 chars to fit in PR body
            BODY=$(head -c 3000 /tmp/consumer-notification.md)
            echo "body<<EOF" >> $GITHUB_OUTPUT
            echo "$BODY" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo 'body=No notification report available.' >> $GITHUB_OUTPUT
          fi

      - name: Create or Update Pull Request
        if: steps.check-stubs.outputs.stubs_exist == 'true'
        env:
          # GITHUB_TOKEN cannot create PRs when "Allow GitHub Actions to create
          # and approve pull requests" is disabled in repo settings.
          # Use PROVIDER_REPO_TOKEN (PAT) instead — it is not subject to that restriction.
          GH_TOKEN: ${{ secrets.PROVIDER_REPO_TOKEN }}
          PROVIDER_SHA: ${{ inputs.provider_sha || github.event.client_payload.provider_sha }}
          STUB_COUNT: ${{ inputs.stub_count || github.event.client_payload.stub_count }}
          SWAGGER_URL: ${{ inputs.swagger_url || github.event.client_payload.swagger_url }}
          BRANCH_NAME: swagger-sync/${{ inputs.provider_sha || github.event.client_payload.provider_sha }}
          PROVIDER_RUN_URL: "https://github.com/${{ inputs.provider_repo || github.event.client_payload.provider_repo }}/actions/runs/${{ inputs.provider_run_id || github.event.client_payload.provider_run_id }}"
          NOTIFICATION_BODY: ${{ steps.notification.outputs.body }}
        run: |
          # 1. Setup Git Identity
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 2. Commit and Push changes
          git checkout -b "$BRANCH_NAME"
          git add tests/DeviceApi.Consumer.Tests/Generated/
          git commit -m "feat: update generated stubs ($PROVIDER_SHA)"
          git push origin "$BRANCH_NAME" --force

          # 3. Write PR body to a temp file so special characters are never
          #    interpreted as shell commands.
          PR_BODY_FILE=$(mktemp /tmp/pr-body.XXXXXX.md)
          {
            echo "## New or changed endpoints detected in \`device-api\`"
            echo ""
            echo "The provider's swagger changed — see commit and stub details in the environment variables."
            echo ""
            echo "---"
            echo "### Provider notification"
            printf '%s\n' "$NOTIFICATION_BODY"
          } > "$PR_BODY_FILE"

          # 4. Ensure labels exist (--force is a no-op if the label already exists)
          gh label create "contract-update"     --color "0075ca" --description "Contract change" --force
          gh label create "swagger-sync"        --color "e4e669" --description "Triggered by swagger-sync" --force
          gh label create "provider-device-api" --color "d93f0b" --description "Provider: device-api" --force

          # 5. Check for existing PR
          PR_NUMBER=$(gh pr list --head "$BRANCH_NAME" --json number --jq '.[0].number')

          if [ -z "$PR_NUMBER" ]; then
            echo "Creating new PR..."
            # gh pr create outputs the PR URL; extract the number from it.
            PR_URL=$(gh pr create \
              --title "feat: new swagger endpoints from device-api ($PROVIDER_SHA)" \
              --body-file "$PR_BODY_FILE" \
              --label "contract-update,swagger-sync,provider-device-api" \
              --base main)
            PR_NUMBER="${PR_URL##*/}"
          else
            # Update body of existing PR
            gh pr edit "$PR_NUMBER" --body-file "$PR_BODY_FILE"
          fi

          rm -f "$PR_BODY_FILE"

          # 5. Post a comment with the Provider Run Link
          gh pr comment "$PR_NUMBER" --body "🔍 **Traceability Link:** These stubs were generated from Provider Run: [View Provider CI Run]($PROVIDER_RUN_URL)"