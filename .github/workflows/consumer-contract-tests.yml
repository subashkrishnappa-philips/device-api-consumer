# ──────────────────────────────────────────────────────────────────────────────
# Consumer Contract Tests — device-api-consumer
#
# Owned by: Mobile Device Management Team  (consumer team)
#
# What runs:
#   1. Build DeviceApi.Consumer.sln
#   2. Run consumer tests — generates pact file in contracts/
#   3. Upload pact file as artifact "pact-contracts" (retained 90 days)
#   4. On main push: dispatch "pact-contracts-updated" to device-api (provider)
#      so the provider pipeline immediately re-verifies the new contract.
#
# Additionally — on repository_dispatch: swagger-updated
#   (fired by device-api's swagger-sync.yml when swagger changes):
#   5. Download generated stubs from provider artifact
#   6. Open a PR in this repo with new stub files in Generated/
#      so the consumer team can review → move to Contracts/ → push
# ──────────────────────────────────────────────────────────────────────────────

name: Consumer Contract Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  repository_dispatch:
    types:
      - pact-contracts-updated  # fired by provider CI after API changes
      - swagger-updated          # fired by provider's swagger-sync when new endpoints added

concurrency:
  # Use event name in group so swagger-updated dispatches don't cancel running push jobs
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true
  CONFIGURATION: Release

# Required for peter-evans/create-pull-request to open PRs
permissions:
  contents: write
  pull-requests: write

jobs:
  # ── Job 1: Build ─────────────────────────────────────────────────────────────
  # Skipped on swagger-updated dispatch (no tests to run, just PR creation)
  build:
    name: Restore & Build
    runs-on: ubuntu-latest
    if: github.event_name != 'repository_dispatch' || github.event.action != 'swagger-updated'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-consumer-${{ runner.os }}-${{ hashFiles('**/packages.lock.json', '**/*.csproj') }}
          restore-keys: nuget-consumer-${{ runner.os }}-

      - name: Restore
        run: dotnet restore DeviceApi.Consumer.sln

      - name: Build
        run: dotnet build DeviceApi.Consumer.sln --no-restore --configuration ${{ env.CONFIGURATION }}

      - name: Cache build output
        uses: actions/cache@v4
        with:
          path: |
            tests/**/bin
            tests/**/obj
          key: build-consumer-${{ runner.os }}-${{ github.sha }}

  # ── Job 2: Generate Pact Contracts ───────────────────────────────────────────
  generate-pacts:
    name: Generate & Publish Pact Contracts
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'repository_dispatch' || github.event.action != 'swagger-updated'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-consumer-${{ runner.os }}-${{ hashFiles('**/packages.lock.json', '**/*.csproj') }}
          restore-keys: nuget-consumer-${{ runner.os }}-

      - name: Restore build output cache
        uses: actions/cache@v4
        with:
          path: |
            tests/**/bin
            tests/**/obj
          key: build-consumer-${{ runner.os }}-${{ github.sha }}

      # contracts/ must exist before tests run so PactNet can write the pact file
      - name: Ensure contracts directory exists
        run: mkdir -p contracts

      - name: Run consumer tests (generates pact contracts)
        run: |
          dotnet test tests/DeviceApi.Consumer.Tests \
            --no-build \
            --configuration ${{ env.CONFIGURATION }} \
            --logger "trx;LogFileName=consumer-results.trx" \
            --logger "console;verbosity=normal" \
            --results-directory TestResults/

      - name: List generated pact files
        run: |
          echo "── contracts/ ──────────────────────────────"
          ls -la contracts/

      # ── Publish pact files so provider CI can download them ──────────────────
      - name: Upload pact contracts
        uses: actions/upload-artifact@v4
        with:
          name: pact-contracts
          path: contracts/*.json
          retention-days: 90
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consumer-test-results-${{ github.sha }}
          path: TestResults/

      - name: Publish test summary
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Consumer Contract Test Results
          path: TestResults/*.trx
          reporter: dotnet-trx
          fail-on-error: true

      # ── Notify provider team: trigger provider verification pipeline ──────────
      # Only fire on main branch pushes (not PRs) to avoid noise.
      #
      # Required secret: PROVIDER_REPO_TOKEN — a PAT or fine-grained token
      # with "Actions: write" (workflow dispatch) permission on device-api repo.
      # Guard: skip if the secret isn't configured yet to avoid
      # "Parameter token or opts.auth is required" from peter-evans/repository-dispatch.
      - name: Dispatch provider verification
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && secrets.PROVIDER_REPO_TOKEN != ''
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.PROVIDER_REPO_TOKEN }}
          repository: ${{ github.repository_owner }}/device-api
          event-type: pact-contracts-updated
          client-payload: |
            {
              "consumer_repo": "${{ github.repository }}",
              "consumer_run_id": "${{ github.run_id }}",
              "consumer_sha": "${{ github.sha }}",
              "consumer_ref": "${{ github.ref_name }}"
            }

  # ── Job 3: Create Stub PR (swagger-updated dispatch only) ────────────────────
  # Triggered when provider's swagger-sync.yml detects new/changed endpoints.
  #
  # Downloads the generated stub files from the provider CI artifact,
  # places them in tests/DeviceApi.Consumer.Tests/Generated/, and opens
  # a PR so the consumer team can review, complete, and merge the stubs.
  #
  # Consumer team workflow after merge:
  #   1. Review Generated/*.cs — understand what changed
  #   2. Move completed interactions to Contracts/DeviceApiConsumerTests.cs
  #   3. Delete the stub from Generated/
  #   4. Push → consumer CI generates new pact → provider CI re-verifies
  create-stub-pr:
    name: Open Stub PR for New Swagger Endpoints
    runs-on: ubuntu-latest
    if: github.event_name == 'repository_dispatch' && github.event.action == 'swagger-updated'

    steps:
      - name: Checkout consumer repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # Download the generated stubs uploaded by provider's swagger-sync job
      - name: Download generated stubs from provider CI
        uses: dawidd6/action-download-artifact@v6
        with:
          # Fall back to GITHUB_TOKEN when PROVIDER_REPO_TOKEN is not yet configured
          # so the action receives a valid auth token and won't throw
          # "Parameter token or opts.auth is required".
          github_token: ${{ secrets.PROVIDER_REPO_TOKEN || github.token }}
          workflow: swagger-sync.yml
          run_id: ${{ github.event.client_payload.provider_run_id }}
          repo: ${{ github.event.client_payload.provider_repo }}
          name: swagger-generated-stubs
          path: tests/DeviceApi.Consumer.Tests/Generated/

      - name: Download consumer notification report
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.PROVIDER_REPO_TOKEN || github.token }}
          workflow: swagger-sync.yml
          run_id: ${{ github.event.client_payload.provider_run_id }}
          repo: ${{ github.event.client_payload.provider_repo }}
          name: consumer-notification
          path: /tmp/
        continue-on-error: true

      - name: List downloaded stubs
        run: |
          echo "── Generated stubs ─────────────────────────────"  
          find tests/DeviceApi.Consumer.Tests/Generated/ -name "*.cs" || echo "(none)"

      - name: Read notification report
        id: notification
        run: |
          if [ -f /tmp/consumer-notification.md ]; then
            # Truncate to 3000 chars to fit in PR body
            BODY=$(head -c 3000 /tmp/consumer-notification.md)
            echo "body<<EOF" >> $GITHUB_OUTPUT
            echo "$BODY" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo 'body=No notification report available.' >> $GITHUB_OUTPUT
          fi

      # Creates or updates a branch and opens a PR
      - name: Create pull request with new stubs
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: swagger-sync/${{ github.event.client_payload.provider_sha }}
          delete-branch: true
          title: >
            feat: new swagger endpoints from device-api
            (${{ github.event.client_payload.provider_sha }})
          body: |
            ## New or changed endpoints detected in `device-api`

            The provider's swagger changed in commit
            [`${{ github.event.client_payload.provider_sha }}`](${{ github.event.client_payload.swagger_url }}).

            The `SwaggerPactGenerator` tool found **${{ github.event.client_payload.stub_count }}** endpoint(s)
            not yet covered by a pact interaction and generated skeleton test stubs.

            ---

            ### What to do

            1. Review the stub files added to `tests/DeviceApi.Consumer.Tests/Generated/`
            2. Complete each stub interaction (fill in request/response details)
            3. Move the completed tests to `tests/DeviceApi.Consumer.Tests/Contracts/DeviceApiConsumerTests.cs`
            4. Delete the stub file from `Generated/`
            5. Merge this PR — the CI pipeline will generate a new pact and notify the provider

            ---

            ### Provider notification

            ${{ steps.notification.outputs.body }}
          labels: |
            contract-update
            swagger-sync
            provider: device-api
          commit-message: |
            feat: add generated stubs for new swagger endpoints

            Provider: ${{ github.event.client_payload.provider_repo }}
            Provider SHA: ${{ github.event.client_payload.provider_sha }}
            Stub count: ${{ github.event.client_payload.stub_count }}
